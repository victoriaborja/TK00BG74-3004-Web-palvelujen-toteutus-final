services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shelter
      POSTGRES_PASSWORD: shelter
      POSTGRES_DB: shelter
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelter -d shelter"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://shelter:shelter@db:5432/shelter
      ADMIN_PASSWORD: shelter-admin
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
